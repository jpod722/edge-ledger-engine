# Parallel track ("Undercurrent Parallel Model Proposal", Nov 3 2026, revised). Step 1 thesis test + Step 0 scope.
# Approved by Justin 2026-11-03 ("Build the parallel"). Reviewer of record: the pro (sole reviewer).
# Registered with code (edge_engine/p1.py), seed and game list (p1-sample.json) BEFORE any line is bought.
# Undercurrent (m3-forward.yaml) is untouched: no rule, model, date or blinding change; Steps 0-1 use no 2026-27 outcomes.

question: "after accounting for DraftKings' own price, do players with fresh teammate absences beat their points lines by enough to matter (either direction)?"
credits: "own registration (M3 bars extra spending): ~3,830 planned (25 weekly event lookups + 380 x 10), HARD STOP 3,900, no retries; account floor 3,000"
sample: "380 regular-season 2024-25 games, stratified by ET month proportional to games played, random.Random(20261103), All-Star games excluded; frozen in config/prereg/p1-sample.json"
snapshot: "historical event odds, latest at or before min(17:30 ET, tip - 90 min)"
market: "player_points, the engine's 10 event_bookmakers (one region; 10 credits/game); consensus stored for later steps"
props: "DraftKings main line (exactly one two-sided line for the player in that snapshot), DK market last_update >= decision - 30 min; player has >= 5 prior played games in 2024-25 and Baseline B projected minutes >= 12; not listed Out"
absences: "official Out on the report selected by printed time <= decision - 15 min (m3 report_by_game.csv); absentee's frozen Baseline B minutes projection >= 15"
fresh: "absentee played in his team's previous game"
stale: "absentee last played 2-5 team games ago (older absences ignored)"
flags: "fresh flag = team fresh vacated minutes >= 15; stale flag = team stale vacated minutes >= 15"
outcome: "standardized margin (points - line) / sqrt(L + L^2 / 7.2); win/loss (over) secondary"
voids: "did not play, integer-line pushes"
regression: "OLS margin ~ 1 + fresh + stale + logit(DK no-vig over, multiplicative)"
inference: "two-sided 95% interval on the fresh coefficient, game-cluster bootstrap, 10,000 draws, seed 20261103"
decision_rule:
  continue: "interval excludes zero AND |fresh coefficient| >= 0.094 (~3 points of over rate); a negative sign means testing unders in those spots"
  stop: "anything else -> stop the parallel track as a negative research result; no retest on this sample"
power_assumed: {se_points_over_rate: 1.3, p_continue: {"0": 0.02, "3": 0.50, "5": 0.94}}
credit_controls:
  fail_closed: "after the first 40 games: < 90% with a fresh two-sided DraftKings player_points market -> stop"
  report: "everything, including a stop"
analysis: "python -m edge_engine.p1 analyze, run once after the pull"

step0_forecast_fixes:   # free; box scores only; fit 2023-24, check 2024-25; each change reported separately; exploratory
  changes: ["empirical minutes residuals by role", "separate half-lives (minutes 3, rate ~12-20)", "dispersion k varying with projection (retest with empirical minutes)", "fresh and stale vacated minutes as separate terms", "median check before any logit map"]
  status: "development only; feeds Step 2 if Step 1 continues"

later_steps: "Steps 2-4 (full backfill ~8,500, 2025-26 scored once under M3, shadow + releases) need their own approval"
pricing_books_later: "open question for the reviewer (Justin dropped FanDuel for Undercurrent's replication)"

