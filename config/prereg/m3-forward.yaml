# M3 prospective paper test + under hypothesis H-U1. Registered 2026-10-24 ~23:10 ET, BEFORE any qualifying observation
# (no 2026-27 player has >= 5 prior current-season games before ~Oct 29). Reviewer approval 2026-10-24 (three-decision memo).
# Paper only. No new credits: uses the DK player_points lines the nightly monitor already captures.

exploratory_record:   # NOT part of any gate; never counted, never used to set parameters below
  run: "2026-10-24, frozen Baseline B on 2026-27 Oct 20-23 DK points props, history seeded with 2025-26 (deviation)"
  result: {props: 207, dates: 4, ll_model: 0.693, ll_dk: 0.695, picks_ev4: 156, roi_all: 0.090, over_picks: [72, -0.031], under_picks: [84, 0.194], unpicked_unders: [123, -0.014], blind_unders: [207, 0.070]}
  caveat: "under/over split found after looking; one date (Oct 21) carries most of it"

model: "Baseline B exactly as config/m3_baseline_frozen.json (h 3, n0 1/1, sigma 5.85/6.92, k 7.2); history = 2026-27 games only, tip < decision time"
universe:
  - ">= 5 prior played games in 2026-27 (no seeded history)"
  - "projected minutes m_hat >= 12"
  - "not listed Out on the selected official report (m3-spec selection rule: printed time <= decision - 15 min)"
  - "DraftKings main player_points line, two-sided, latest capture at or before the decision time; venue last_update <= 30 min old"
decision_time: "min(17:30 ET, tip - 90 min), per m3-spec"
logging: "every eligible prop logged (picks and non-picks): model probability, DK prices, timestamps, outcome, exclusion reason for every captured prop that fails eligibility"
settlement: "DNP = void (dropped from both portfolios); integer-line push = void; flat 1-unit stakes at the recorded DK price"

hypothesis_H_U1:
  statement: "model-selected unders outperform blind unders in net realized ROI"
  pick: "Baseline B raw-model EV on the under >= 4% at the recorded DK under price: (1 - p_over) * d_under - 1 >= 0.04, push mass excluded"
  comparator: "all eligible unders in the same prospective universe (overlapping portfolio, declared)"
  statistic: "ROI(model unders) - ROI(blind unders), ROI = sum(return) / number of bets in that portfolio"
  inference: "date-cluster bootstrap: resample whole ET dates with replacement (10,000 reps, seed 20261024), recompute both portfolios' ROI on each resample and their difference; one-sided 95% lower bound = 5th percentile"
  pass: "lower bound > 0"
  minimums: "evaluated once, at the first date on which >= 150 model-selected unders over >= 30 distinct dates are settled"
  no_early_stop: true
  incomplete: "if the minimums are not met by the end of the 2026-27 regular season or when line capture stops for good -> inconclusive"
  diagnostics_only: [distinct players, games, dates, ROI by date and concentration, result excluding the single most profitable date, over-side analogue, calibration of p_model]
  not_authorized: [threshold changes, model changes, real-money bets]

gate_A_counting: "prospective eligible props from this file count toward m3-spec Gate A; the 207 seeded props never do"

screening_2024_25:   # reviewer: approved as exploratory only
  protocol: "exactly m3-spec feature_selection (fit 2023-24, evaluate 2024-25 chronologically, cumulative in the listed order, CRPS gain, date-cluster one-sided LB, Holm across 6)"
  status: exploratory
  report: "all six additions with gain, LB, Holm decision — failures included"
  consequence: "a retained addition changes nothing in production or Gate A until it passes a later, untouched prospective evaluation"

implementation_2026-10-24:   # before any qualifying observation; no rule above changed
  code: "edge_engine/m3_forward.py; runs after every nightly monitor job (free) and writes data/m3/forward/{props.csv,status.json}"
  reports: "official PDFs captured by the monitor; selection by printed header time <= decision - 15 min; Out matched by normalized name on the game date"
  evaluation_cut: "H-U1 uses data through the first date on which both minimums hold, even if the job runs later; result file written once, never recomputed"
  interim: "status.json shows counts only (picks, dates, exclusions); no ROI before the evaluation"
  timing: "monitor gets 1 PM and 3 PM ET starts so the decision snapshot is taken despite late GitHub cron; captures after the decision are excluded, never substituted"

hypothesis_H_U1_KX:   # secondary replication; reviewer approval 2026-10-24; registered before any qualifying observation
  role: "replication only. H-U1 (DraftKings) is the sole primary; KX cannot rescue a DK fail; DK pass + KX fail = 'not replicated'; arms share players/games/signals -> reported side by side, never pooled, not an independent confirmation"
  model_universe_settlement: "identical to H-U1 (same eligible DK props, frozen Baseline B, Out filter); Kalshi 'inactive / never takes the court -> fair price' outcomes excluded from both portfolios, like a void"
  rung: "fixed from the DK main line before any Kalshi price is read: DK Under L.5 -> NO on the Kalshi rung with floor_strike L.5 (title (L+1)+). Missing rung, integer DK line, or invalid book -> excluded; never a neighbouring rung"
  model_probability: "Baseline B priced at that exact threshold: p_no = P(points <= L)"
  quote: "last captured KXNBAPTS market page at or before the decision; age <= 30 min (age recorded for every quote); two-sided book required (0 < yes_bid < yes_ask < 1); unavailable -> excluded, never zero-priced"
  price: "NO ask = 1 - best YES bid; NO bid = 1 - best YES ask"
  fees: "taker fee per order = round up to the next cent of M x 0.07 x C x P x (1 - P); KXNBAPTS fee_type quadratic, fee_multiplier M = 1 (Kalshi series API, checked 2026-10-24); C = 10"
  stake_and_return: "fixed paper order of 10 contracts at the NO ask for every eligible contract (picks and comparator alike); cost = 10 x ask + fee; payout = 10 x $1 if NO wins else 0; return = payout / cost - 1"
  pick: "EV = p_no x 10 / cost - 1 >= 0.04"
  comparator: "all eligible NO contracts on the fixed rungs"
  statistic_inference: "same as H-U1: ROI(picks) - ROI(all eligible); date-cluster bootstrap, 10,000 reps, seed 20261024, one-sided 95% LB > 0"
  minimums: ">= 150 settled picks over >= 30 dates; evaluated once, using data through the first date both hold; never met -> incomplete (not pass, not fail)"
  track_A: "primary KX statistic above, at the displayed top-of-book NO ask, no depth filter"
  track_B_execution: "reported only: share of picks with top-of-book NO depth < 10, median bid-ask spread, ROI on picks with depth >= 10, overlap with DK picks. The captured feed has top-of-book size only, so this is a liquidity proxy, not an executable multi-level simulation"
  k1: "unchanged; H-U1-KX is taker-only paper. No Kalshi account or API keys"
  code: "edge_engine/m3_forward.py (Kalshi, kx_arm, kx_fee)"
  coverage_note: "Kalshi KXNBAPTS rungs are 5 points apart (x4.5 / x9.5 strikes), so only DK main lines ending in 4.5 or 9.5 have a corresponding rung (~1 in 5 props in the Oct 24 capture)"

amendment_H_U1_KX_2026-10-24b:   # reviewer-approved, BEFORE any qualifying observation; supersedes hypothesis_H_U1_KX.rung only
  reason: "exact-rung rule covered ~10% of eligible props in the Oct 20-24 capture (Kalshi strikes are x4.5/x9.5 only); 150 picks unlikely"
  superseded: "hypothesis_H_U1_KX.rung (exact floor_strike == DK line) — kept above for the audit trail; never evaluated; the two versions are never combined"
  rung: "the listed Kalshi threshold numerically nearest the DK main-line threshold (|floor_strike - DK line|), ties to the lower rung; listed = appearing in any captured KXNBAPTS page at or before the decision; chosen mechanically before any Kalshi price is read"
  example: "DK 22.5 with Kalshi 21.5 / 26.5 -> 21.5"
  model_price: "Baseline B priced at the selected threshold: p_no = 1 - P(points > floor_strike); never the DK probability"
  no_substitution: "selected rung missing at the decision, stale (> 30 min), or not two-sided -> excluded; never a different rung"
  description: "nearest-rung cross-market replication, not an exact-contract replication; kx_strike_gap (Kalshi threshold - DK line) logged for every contract"
  unchanged: "everything else in hypothesis_H_U1_KX: fees, 10-contract order, pick EV >= 4%, comparator, bootstrap, 150 picks / 30 dates, one-time evaluation, incomplete if never met, Track A/B, DK primary"
  no_further_widening: "the mapping is not widened again after any prospective outcome is seen"
  coverage_check_pre_registration: "Oct 20-24 capture with eligibility relaxed (counts only, no outcomes or prices examined): ~50% of eligible props have a Kalshi ladder for that player-game; the rest have no ladder listed"
