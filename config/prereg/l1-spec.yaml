  pilot_outcome: "mixed: 22/50 triggers in window (request at :37 missed a 37-40 s drifting grid); scored 18/22 in window; DK-Pinnacle exact live spread match 2/11"
  entry_request: "request at Q2 End Period wall clock + 5 min (validated on pilot grid timestamps: first-after-end 86/86, before Q3 78/86). Games whose Q2 ends fall strictly inside one grid cell (k*300+40 s, (k+1)*300+37 s] share one request at (k+1)*300+45 s. Per-game verification unchanged: snapshot >= end, previous < end, snapshot < first Q3 play; failures recorded, never replaced"
  arms: "halftime moneyline only (spread arm dropped: contract comparability)"
  sample: "pooled 2024-25 + 2025-26 regular seasons, excluding 2025-10-21..2025-11-30 (pilot); one confirmatory test; per-season results reported as diagnostics only"
  universe_from_free_data: {triggers: 438, trigger_dates: 220, control_pool: 614, file: config/prereg/l1-universe.csv}
  projected_scored: {triggers: 326, controls_if_equal: 302, basis: "in-window 0.907 (pilot grid simulation) x scored-in-window 0.82 trigger / 0.76 control (pilot)"}
  controls: "seeded sample (seed 20261026) from the control pool; size set by the reviewer's cap decision"
  credits: {line_item: "one 10-credit moneyline pull per distinct request; equal-size controls -> 809 requests = 8,090 credits; triggers alone 426 requests = 4,260", reviewer_cap: 6100, status: "pending reviewer decision: raise cap to 8,100 or cut controls to ~220"}
  primary_test: unchanged
