name: scoreboard
# Morning Scoreboard: frozen scorers -> data/scoreboard.json. No Odds API credits.
on:
  schedule:
    - cron: "7 13 * * *"           # 9:07 AM EDT / 8:07 AM EST, after the night's monitor runs finish
  workflow_dispatch: {}
concurrency:
  group: scoreboard
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - name: Tests must pass before scoring
        run: python -m pytest -q
      - name: Check out the data branch
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --quiet --depth 1 --branch data --single-branch "$URL" data
      - run: python -m edge_engine.scoring --data data
      - name: Commit data
        run: |
          cd data
          git config user.name "edge-engine"; git config user.email "edge-engine@users.noreply.github.com"
          git add scoreboard.json
          git commit -q -m "scoreboard $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3 4 5; do git push -q origin data && break; git pull -q --rebase origin data; done
