name: engine
on:
  workflow_dispatch:
    inputs:
      task:
        description: "scan | close | grade | backtest | backtest-report | probe | d1 | s1"
        required: true
      args:
        description: "extra CLI args, e.g. --sport NBA --scan nba-evening --window today_et --derivatives --props"
        required: false
        default: ""
  schedule:
    - cron: "17 9 * * *"     # nightly grade, 5:17 AM ET
concurrency:
  group: data-branch
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      TASK: ${{ github.event.inputs.task || 'grade' }}
      ARGS: ${{ github.event.inputs.args }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Tests must pass before any data is written
        run: python -m pytest -q
      - name: Check out the data branch
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git clone --quiet --branch data --single-branch "$URL" data
          else
            mkdir data && cd data && git init -q -b data && git remote add origin "$URL"
          fi
      - name: Run engine
        run: |
          set -e
          case "$TASK" in
            scan|close|grade|backtest-report|probe|d1-report) python -m edge_engine.cli --data data $TASK $ARGS ;;
            s1)
              python -m edge_engine.cli --data data s1-run
              python -m edge_engine.cli --data data s1-report ;;
            d1)
              python -m edge_engine.cli --data data d1-run $ARGS
              python -m edge_engine.cli --data data d1-report ;;
            backtest)
              python scripts/backtest_all.py --data data
              python -m edge_engine.cli --data data backtest-report ;;
            *) echo "unknown task $TASK"; exit 1 ;;
          esac
      - name: Commit data
        if: always()
        run: |
          cd data
          git config user.name "edge-engine"; git config user.email "edge-engine@users.noreply.github.com"
          git add -A
          git commit -q -m "$TASK $(date -u +%FT%TZ) ${{ github.run_id }}" || exit 0
          git push -q origin data
